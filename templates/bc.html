<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<title>BC</title>

<style>
@font-face {
  font-family: 'Inter';
  src: url('../fonts/Inter-Regular.ttf') format('truetype');
  font-weight: 400;
}
@font-face {
  font-family: 'Inter';
  src: url('../fonts/Inter-Bold.ttf') format('truetype');
  font-weight: 700;
}
@font-face {
  font-family: 'Inter-Black.ttf';
  src: url('../fonts/Inter-Black.ttf') format('truetype');
  font-weight: 900;
}

* { 
  box-sizing: border-box;
  font-family: Inter, sans-serif;
  text-transform: uppercase;
}

body {
  margin: 0;
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ================= CARD ================= */
.card {
  width: 700px;
  height: 1057.5px;
  background: #ffffff;
  border: 6px solid #F2C94C;
  border-radius: 70px;
  display: flex;
  flex-direction: column;
  justify-content: space-between; /* distribuição vertical */
  align-items: center;
  color: #1F3C6E;
  padding: 60px 20px 30px 20px;
  position: relative;
  overflow: visible;
}

/* ===== SELO AJUSTADO ===== */
.selo {
  position: absolute;
  top: -6px;
  left: -6px;
  width: 130px;
  height: 65px;
  z-index: 10;
}

.selo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* LOGO */
.logo {
  height: 154px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo img {
  max-height: 154px;
  max-width: 520px;
  object-fit: contain;
}

/* TÍTULO */
.titulo {
  background: #1F3C6E;
  color: #ffffff;
  padding: 20px 50px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 60px;
}

/* TEXTO */
.texto {
  text-align: center;
  font-weight: 400;
  font-size: 28px;
  max-width: 550px;
  line-height: 1.15;
  word-break: break-word;
}

/* BENEFÍCIO (INALTERADO) */
.beneficio {
  text-align: center;
}

.percentual {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  width: 100%;
  padding: 0 30px;
  margin-bottom: 20px;
}

.numero {
  font-weight: 900;
  font-size: clamp(120px, 25vw, 240px);
  line-height: 0.8;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.percent {
  font-weight: 900;
  font-size: clamp(120px, 25vw, 240px);
  margin-left: 6px;
  line-height: 0.8;
}

.desconto {
  margin-top: 0px;
  font-weight: 700;
  font-size: 46px;
}

/* COMPLEMENTO E LEGAL */
.complemento {
  text-align: center;
  font-weight: 400;
  font-size: 28px;
  max-width: 550px;
  line-height: 1.15;
  word-break: break-word;
}

.legal {
  text-align: center;
  font-size: 18px;
  max-width: 550px;
  line-height: 1.15;
  word-break: break-word;
}

/* RODAPÉ */
.rodape {
  margin-bottom: 30px;
  text-align: center;
  min-height: 70px;
}

/* UF e URN IGUAIS */
.uf,
.urn {
  font-size: clamp(20px, 2vw, 24px);
  font-weight: 700;
}

/* SEGMENTO PADRÃO CUPOM */
.segmento-linha {
  margin-top: 12px;
  font-size: clamp(18px, 1.5vw, 18px);
}

.segmento-valor {
  font-size: clamp(20px, 2vw, 25px);
  font-weight: 700;
}
</style>
</head>

<body>
<div class="card">

  <div class="selo">
    <img src="{{SELO}}" alt="Selo">
  </div>

  <div class="logo">
    <img src="{{LOGO}}" alt="Logo">
  </div>

  <div class="titulo">BC</div>
	  
  <div class="texto">{{TEXTO}}</div>

  <div class="beneficio">
    <div class="percentual">
      <div class="numero">{{VALOR}}</div>
      <div class="percent">%</div>
    </div>
    <div class="desconto">DE DESCONTO</div>
  </div>

  <div class="complemento">{{COMPLEMENTO}}</div>
  <div class="legal">{{LEGAL}}</div>

  <div class="rodape">
    <div class="uf">{{UF}}</div>
    <div class="urn">{{URN}}</div>

    <div class="segmento-linha" id="segmento-linha">
      SEGMENTO DE CLIENTES:
      <span class="segmento-valor">{{SEGMENTO}}</span>
    </div>
  </div>

</div>

<script>
(function () {
  const segmento = document.getElementById("segmento-linha");
  if (!segmento) return;

  const texto = segmento.innerText
    .replace("SEGMENTO DE CLIENTES:", "")
    .trim();

  if (!texto) {
    segmento.style.visibility = "hidden"; /* preserva espaço */
  }
})();
</script>

</body>
</html>
