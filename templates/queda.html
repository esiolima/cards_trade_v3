<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=700, initial-scale=1.0" />
<title>Queda de Preço</title>

<style>

@font-face {
  font-family: 'Inter';
  src: url('../fonts/Inter-Regular.ttf') format('truetype');
  font-weight: 400;
}

@font-face {
  font-family: 'Inter';
  src: url('../fonts/Inter-Bold.ttf') format('truetype');
  font-weight: 700;
}

@font-face {
  font-family: 'Inter-Black';
  src: url('../fonts/Inter-Black.ttf') format('truetype');
  font-weight: 900;
}

* {
  box-sizing: border-box;
  text-transform: uppercase;
  font-family: 'Inter', sans-serif;
  color: #1F3C6E;
}

body {
  margin: 0;
  width: 700px;
  height: 1058px;
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ================= CARD ================= */
.card {
  width: 700px;
  height: 1058px;
  border: 8px solid #e0b84b;
  border-radius: 40px;
  background: #ffffff;
  padding: 70px 40px 60px 40px;
  display: flex;
  flex-direction: column;
  justify-content: space-between; /* distribuição vertical */
  overflow: visible;
  position: relative;
}

/* ===== SELO PADRÃO ===== */
.selo {
  position: absolute;
  top: -8px;
  left: -8px;
  width: 130px;
  height: 65px;
  z-index: 10;
}

.selo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* LOGO */
.logo {
  text-align: center;
}

.logo img {
  max-width: 240px;
  max-height: 120px;
}

/* TARJA */
.tarja {
  background: #15803d;
  color: #ffffff;
  font-weight: 700;
  font-size: 42px;
  text-align: center;
  padding: 18px 40px;
  border-radius: 999px;
  margin: 20px auto;
  white-space: nowrap;
}

/* AREA CENTRAL */
.area-central {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 30px;
  text-align: center;
}

/* TEXTO */
.texto-topo {
  font-size: 26px;
  line-height: 1.2;
  word-break: break-word;
}

/* VALOR (INALTERADO) */
.valor-container {
  display: flex;
  justify-content: center;
  align-items: center;
}

.valor-texto {
  font-weight: 900;
  font-size: 260px;
  line-height: 1;
  white-space: nowrap;
}

/* DESCONTO */
.desconto {
  font-size: 44px;
  font-weight: 700;
}

/* COMPLEMENTO */
.complemento {
  font-size: 24px;
  line-height: 1.2;
  max-width: 560px;
  word-break: break-word;
}

/* RODAPÉ */
.rodape {
  text-align: center;
  min-height: 70px;
}

/* UF E URN IGUAIS */
.uf,
.urn {
  font-size: 22px;
  font-weight: 700;
}

/* SEGMENTO PADRÃO CUPOM */
.segmento-linha {
  margin-top: 10px;
  font-size: 18px;
}

.segmento-valor {
  font-size: 22px;
  font-weight: 700;
}

</style>
</head>

<body>

<div class="card">

  <div class="selo">
    <img src="{{SELO}}" />
  </div>

  <div class="logo">
    <img src="{{LOGO}}" />
  </div>

  <div class="tarja">
    QUEDA DE PREÇO
  </div>

  <div class="area-central">

    <div class="texto-topo">
      {{TEXTO}}
    </div>

    <div class="valor-container">
      <div class="valor-texto">
        {{VALOR}}%
      </div>
    </div>

    <div class="desconto">
      DE DESCONTO
    </div>

    <div class="complemento">
      {{COMPLEMENTO}}
    </div>

  </div>

  <div class="rodape">
    <div class="uf">{{UF}}</div>
    <div class="urn">{{URN}}</div>

    <div class="segmento-linha" id="segmento-linha">
      SEGMENTO DE CLIENTES:
      <span class="segmento-valor">{{SEGMENTO}}</span>
    </div>
  </div>

</div>

<script>
(function () {
  const segmento = document.getElementById("segmento-linha");
  if (!segmento) return;

  const texto = segmento.innerText
    .replace("SEGMENTO DE CLIENTES:", "")
    .trim();

  if (!texto) {
    segmento.style.visibility = "hidden";
  }
})();
</script>

</body>
</html>
