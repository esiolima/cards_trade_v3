<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<title>Cupom de Desconto</title>

<style>
@font-face {
  font-family: 'Inter';
  src: url('../fonts/Inter-Regular.ttf') format('truetype');
  font-weight: 400;
}
@font-face {
  font-family: 'Inter';
  src: url('../fonts/Inter-Bold.ttf') format('truetype');
  font-weight: 700;
}
@font-face {
  font-family: 'Inter';
  src: url('../fonts/Inter-Black.ttf') format('truetype');
  font-weight: 900;
}

* {
  box-sizing: border-box;
  font-family: Inter, sans-serif;
  text-transform: uppercase;
}

body {
  margin: 0;
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ================= CARD ================= */
.card {
  width: 700px;
  height: 1057.5px;
  border: 6px solid #F2C94C;
  border-radius: 48px;
  background: #ffffff;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 60px 20px 30px 20px;
  position: relative;
  overflow: visible;
  color: #1F3C6E;
}

/* ===== SELO ===== */
.selo {
  position: absolute;
  top: -6px;
  left: -6px;
  width: 130px;
  height: 65px;
  z-index: 10;
}

.selo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ===== LOGO ===== */
.logo {
  height: 154px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo img {
  max-height: 154px;
  max-width: 520px;
  object-fit: contain;
}

/* ===== TEXTO ===== */
.condicao {
  max-width: 550px;
  font-size: 28px;
  text-align: center;
  line-height: 1.15;
}

/* ===== BENEFÍCIO ===== */
.bloco-beneficio {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.percentual {
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.numero,
.percent {
  font-weight: 900;
  font-size: clamp(120px, 25vw, 270px);
}

.percent {
  margin-left: 6px;
}

.desconto {
  margin-top: 1px;
  font-size: clamp(40px, 5vw, 60px);
  font-weight: 700;
}

/* ===== LEGAL ===== */
.legal {
  max-width: 550px;
  font-size: 18px;
  text-align: center;
}

/* ===== CUPOM BOX ===== */
.cupom-box {
  width: 640px;
  height: 150px;
  background: #16A7E0;
  border-radius: 24px;
  display: grid;
  grid-template-columns: 105px 1fr; /* label levemente menor */
  align-items: center;
}
/* LABEL */
.cupom-label {
  display: flex;
  align-items: center;
  justify-content: center;
}

.cupom-label span {
  transform: translateX(-8px) rotate(-90deg);
  font-size: 30px;
  font-weight: 700;
  color: #ffffff;
}

/* ÁREA DO TEXTO */
.cupom-codigo {
  display: flex;
  align-items: center;
  justify-content: center;
  padding-left: 50px;   /* margem interna real */
  padding-right: 50px;  /* margem interna real */
  overflow: hidden;
}

/* TEXTO */
#cupom-text {
  font-size: 100px;
  font-weight: 900;
  color: #ffffff;
  white-space: nowrap;
}

/* ===== RODAPÉ ===== */
.rodape {
  text-align: center;
  min-height: 70px;
}

/* UF E URN COM MESMA FORMATAÇÃO */
.uf,
.urn {
  font-size: 22px;
  font-weight: 700;
}

.segmento-linha {
  margin-top: 10px;
  font-size: 18px;
}

.segmento-valor {
  font-weight: 700;
}
</style>
</head>

<body>
<div class="card">

  <div class="selo">
    <img src="{{SELO}}" alt="Selo">
  </div>

  <div class="logo">
    <img src="{{LOGO}}" alt="Logo">
  </div>

  <div class="condicao">{{TEXTO}}</div>

  <div class="bloco-beneficio">
    <div class="percentual">
      <div class="numero">{{VALOR}}</div>
      <div class="percent">%</div>
    </div>
    <div class="desconto">DE DESCONTO</div>
  </div>

  <div class="legal">{{LEGAL}}</div>

  <div class="cupom-box">
    <div class="cupom-label">
      <span>CUPOM</span>
    </div>

    <div class="cupom-codigo">
      <span id="cupom-text">{{CUPOM}}</span>
    </div>
  </div>

  <div class="rodape">
    <div class="uf">{{UF}}</div>
    <div class="urn">{{URN}}</div>
    <div class="segmento-linha">
      SEGMENTO DE CLIENTES:
      <span class="segmento-valor">{{SEGMENTO}}</span>
    </div>
  </div>

</div>

<script>
(function () {

  const el = document.getElementById("cupom-text");
  if (!el) return;

  const container = el.parentElement;

  const style = window.getComputedStyle(container);
  const paddingLeft = parseFloat(style.paddingLeft);
  const paddingRight = parseFloat(style.paddingRight);

  // largura real interna
  const larguraUtil =
    container.clientWidth - paddingLeft - paddingRight - 4; 
    // margem de segurança de 4px apenas

  let fontSize = 100;
  const minFontSize = 40; // evita encolher demais

  el.style.fontSize = fontSize + "px";

  while (el.scrollWidth > larguraUtil && fontSize > minFontSize) {
    fontSize--;
    el.style.fontSize = fontSize + "px";
  }

})();
</script>

</body>
</html>
