<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
}

.cupom-container {
    position: relative;
    width: 800px;
    padding: 40px;
    border: 2px solid #000;
    margin: auto;
    box-sizing: border-box;
}

/* SELO MAIOR E COLADO NO TOPO ESQUERDO */
.selo {
    position: absolute;
    top: 0;
    left: 0;
    width: 150px; /* ajuste livre */
    height: auto;
    margin: 0;
    padding: 0;
}

/* LOGO REDUZIDO EM 15% */
.logo {
    width: 85%;
    display: block;
    margin: 60px auto 20px auto;
}

/* TÍTULO */
.titulo {
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    margin-top: 10px;
}

/* TEXTO PRINCIPAL */
.texto {
    text-align: center;
    font-size: 20px;
    margin: 20px 0;
}

/* ÁREA DO CUPOM */
.cupom-wrapper {
    position: relative;
    margin-top: 40px;
    text-align: center;
}

/* PALAVRA CUPOM ROTACIONADA E MAIOR */
.cupom-rotacionado {
    position: absolute;
    left: -60px;
    top: 50%;
    transform: rotate(-90deg);
    transform-origin: left top;
    font-size: 36px;
    font-weight: bold;
}

/* CÓDIGO DO CUPOM CENTRALIZADO */
.cupom-codigo {
    font-size: 48px;
    font-weight: bold;
    text-align: center;
    width: 100%;
}

/* RODAPÉ EM UMA LINHA */
.rodape {
    margin-top: 60px;
    text-align: center;
    font-size: 16px;
    white-space: nowrap;
}

</style>
</head>

<body>

<div class="cupom-container">

    <!-- SELO -->
    <img src="{{SELO}}" class="selo">

    <!-- LOGO -->
    <img src="{{LOGO}}" class="logo">

    <h1 class="titulo">{{TITULO}}</h1>

    <p class="texto">
        {{TEXTO_PRINCIPAL}}
    </p>

    <div class="cupom-wrapper">
        <div class="cupom-rotacionado">CUPOM</div>
        <div class="cupom-codigo">{{CUPOM}}</div>
    </div>

    <div class="rodape">
        {{RODAPE}}
    </div>

</div>

</body>
</html>
